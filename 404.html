<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 | 雷一鸣工作室</title>
<meta name="description" content="你访问的链接已失效，页面可能已被移动或删除。可返回雷一鸣工作室首页继续浏览。">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f8fb; --fg:#1d2430; --muted:#5c6878; --faint:#dce2ea;
  --line:#e2e7ee; --card:#ffffff; --btn:#1a6bff; --btn-fg:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1116; --fg:#e8edf3; --muted:#98a4b2; --faint:#29313c;
    --line:#262e38; --card:#161b22; --btn:#3a6fdf; --btn-fg:#ffffff;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(28px,6vw,64px) 20px;
}
.code{
  margin:0;font-size:clamp(60px,17vw,100px);font-weight:700;
  line-height:1;letter-spacing:.06em;color:var(--faint);
}
h1{margin:.35em 0 0;font-size:clamp(22px,5vw,30px);font-weight:600;line-height:1.4}
.desc{margin:.7em auto 0;max-width:32em;color:var(--muted);font-size:clamp(14px,3.6vw,16px)}
.home{
  display:inline-block;margin-top:28px;min-height:44px;line-height:44px;padding:0 30px;
  border-radius:8px;background:var(--btn);color:var(--btn-fg);
  font-weight:600;text-decoration:none;
}
.home:hover{filter:brightness(1.08)}
.home:active{filter:brightness(.94)}
.home:focus-visible{outline:3px solid var(--muted);outline-offset:3px}
@media (max-width:360px){.home{padding:0 20px}}
@media (prefers-reduced-motion:no-preference){.home{transition:filter .15s ease}}
</style>
</head>
<body>
<main class="wrap">
  <p class="code" aria-hidden="true">404</p>
  <h1>页面不存在</h1>
  <p class="desc">你访问的链接已失效，页面可能已被移动或删除，也可能地址输入有误。</p>
  <a class="home" href="/">返回首页</a>
</main>
</body>
</html>
